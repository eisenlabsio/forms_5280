<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="app_title">טוען...</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1 data-i18n="header_welcome">טוען...</h1>
    </header>
    <main>
        <section id="quiz-selection">
            <h2 data-i18n="quiz_selection_heading">טוען...</h2>
            <div id="quiz-list">
                <!-- Quiz list will be loaded here by JavaScript -->
            </div>
        </section>
        <section id="quiz-display" style="display: none;">
            <h2 id="quiz-title"></h2>
            <p id="quiz-description"></p>
            <div id="quiz-questions">
                <!-- Quiz questions will be loaded here by JavaScript -->
            </div>
            <button id="submit-quiz" data-i18n="submit_quiz_button" style="display: none;">טוען...</button>
        </section>
    </main>
    <footer>
        <p data-i18n="footer_text">טוען...</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
